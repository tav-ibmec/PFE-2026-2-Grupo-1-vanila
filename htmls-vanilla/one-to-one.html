<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Studio One to One: treinamento personalizado, fisioterapia e nutrição em um cuidado integrado."
    />
    <title>One to One</title>
    <link rel="icon" href="data:," />

    <!-- Fontes do Google (Bebas Neue e Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS do site, script do menu e script da agenda do professor -->
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
    <script src="js/agendamento.js" defer></script>
  </head>
  <body class="oto">
    <!-- Link que só aparece ao apertar Tab: pula direto para o conteúdo principal -->
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

    <!-- Cabeçalho: logo, menu e botões de ação -->
    <header class="landing-header">
      <a
        class="landing-logo oto-landing-logo"
        href="index.html"
        aria-label="Voltar para Playmakerz e One to One"
      >
        <img
          src="assets/imagens-padronizacao/assets/one-to-one/LOGO_OTO_1.png"
          alt="One to One Studio"
        />
      </a>

      <!-- Botão do menu no celular -->
      <button
        class="menu-toggle"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="oto-navigation"
      >
        <span aria-hidden="true">☰</span>
      </button>

      <!-- Menu principal da página -->
      <nav
        class="landing-nav"
        id="oto-navigation"
        aria-label="Navegação principal"
      >
        <ul>
          <li><a href="#home" aria-current="page">Home</a></li>
          <li><a href="#sobre">Sobre Nós</a></li>
          <li><a href="#planos">Planos</a></li>
          <li><a href="#contato">Contato</a></li>
          <li><a class="hub-return" href="index.html">Hub</a></li>
        </ul>
      </nav>

      <a class="student-link" href="#contato">Já sou aluno</a>
      <a class="button button-blue header-cta" href="#planos">Matricule-se!</a>
    </header>

    <main id="main-content">
      <!-- Hero: a arte de fundo já traz a frase, então o h1 fica escondido só para leitores de tela -->
      <section
        class="landing-hero oto-hero"
        id="home"
        aria-labelledby="oto-title"
      >
        <h1 class="visually-hidden" id="oto-title">Amplie seu potencial</h1>
        <a class="button button-dark oto-hero-button" href="#sobre"
          >Saiba Mais!</a
        >

        <!-- Seta que leva para a próxima seção -->
        <button
          class="scroll-cue"
          type="button"
          data-scroll-target="sobre"
          aria-label="Ir para Sobre a One to One"
        >
          <span aria-hidden="true"></span>
        </button>
      </section>
